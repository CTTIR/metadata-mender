name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json'))"
          node -e "JSON.parse(require('fs').readFileSync('update.json'))"
      - name: Syntax check
        run: |
          node --check bootstrap.js
          node --check content/metadata-mender.js
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Build and verify XPI
        run: |
          ./build.sh
          python3 tools/build.py --check "metadata-mender-$(node -p 'require("./manifest.json").version').xpi"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build XPI
        id: package
        run: |
          version=$(node -p 'require("./manifest.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
          ./build.sh
          python3 tools/build.py --check "metadata-mender-$version.xpi"
          echo "artifact=metadata-mender-$version.xpi" >> "$GITHUB_OUTPUT"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.artifact }}
          fail_on_unmatched_files: true
